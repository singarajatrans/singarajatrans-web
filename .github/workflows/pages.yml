name: Validate and deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and reference fares
        run: |
          node --check assets/core.js
          node --check assets/app.js
          node --check assets/booking.js
          node --check assets/mobile-bottom-nav.js
          node --check assets/mobile-header.js
          node --check assets/mobile-home-v2.js
          node --check assets/pwa.js
          node --check sw.js
          node tests/core.test.cjs
      - name: Prepare browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-qa" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser-qa/node_modules/.bin/playwright" install --with-deps chromium webkit firefox
      - name: Check responsive booking interface
        timeout-minutes: 20
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-qa/node_modules/playwright
        run: |
          node tests/mobile-search-lifecycle.cjs
          node tests/ios-scroll.cjs
          node tests/home-mobile-v2.cjs
          node tests/browser.cjs
      - name: Save visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: qa-output/
          retention-days: 7
      - name: Package website
        run: |
          mkdir _site
          cp index.html robots.txt manifest.webmanifest offline.html sw.js _site/
          cp -r assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
